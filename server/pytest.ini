[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -q -n auto --dist loadfile
timeout = 30
timeout_method = thread
markers =
    e2e: full-stack journey tests backed by the real SQLite test database
    unit: pure-logic tests with no DB or network
    api: HTTP route tests against the real SQLite test database
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

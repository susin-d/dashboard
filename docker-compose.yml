
services:
  postgres:
    image: postgres:16-alpine
    container_name: starwaves-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: starwaves
      POSTGRES_PASSWORD: starwaves_password
      POSTGRES_DB: starwaves
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - starwaves-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starwaves -d starwaves"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: starwaves-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - APP_ENV=production
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://starwaves:starwaves_password@postgres:5432/starwaves
      - WHATSAPP_GATEWAY_URL=http://whatsapp-worker:3001
    expose:
      - "8000"
    ports:
      - "8000:8000"
    networks:
      - starwaves-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: starwaves-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      server:
        condition: service_healthy
    networks:
      - starwaves-network

  whatsapp-worker:
    build:
      context: ./services/whatsapp-worker
      dockerfile: Dockerfile
    container_name: starwaves-whatsapp-worker
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      - BACKEND_WEBHOOK_URL=http://server:8000/api/v1/whatsapp/webhook
    ports:
      - "3001:3001"
    volumes:
      - whatsapp-data:/app/data
    networks:
      - starwaves-network

networks:
  starwaves-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  nginx-logs:
    driver: local
  whatsapp-data:
    driver: local
